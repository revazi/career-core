name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

      - name: Verify agent capability output
        run: |
          cargo run --quiet --locked -p career-cli -- capabilities > /tmp/capabilities.json
          python3 -m json.tool /tmp/capabilities.json > /dev/null
          python3 -m json.tool schemas/capabilities-v1.schema.json > /dev/null
          grep -q '"schema_version": "career.capabilities.v1"' /tmp/capabilities.json
