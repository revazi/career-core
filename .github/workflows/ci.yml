name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

      - name: Verify Swift rustup selection guards
        run: bash scripts/test-swift-rustup-toolchain.sh

      - name: Verify minimum supported Rust version
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --all-features --locked

      - name: Verify source installation
        run: |
          cargo install --path crates/career-cli --locked --root "$RUNNER_TEMP/career-install"
          "$RUNNER_TEMP/career-install/bin/career" capabilities --format json-compact \
            > "$RUNNER_TEMP/installed-capabilities.json"
          "$RUNNER_TEMP/career-install/bin/career" operations --format json-compact \
            > "$RUNNER_TEMP/installed-operations.json"
          python3 -m json.tool "$RUNNER_TEMP/installed-capabilities.json" > /dev/null
          python3 -m json.tool "$RUNNER_TEMP/installed-operations.json" > /dev/null
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/career-install/bin/career" schema export \
              --id career.job_match.v1 --format json-compact \
              > installed-job-match-schema.json
            "$RUNNER_TEMP/career-install/bin/career" schema bundle \
              --id career.job_match_input.v1 --format json-compact \
              > installed-job-match-input-bundle.json
          )
          python3 -m json.tool "$RUNNER_TEMP/installed-job-match-schema.json" > /dev/null
          python3 -m json.tool "$RUNNER_TEMP/installed-job-match-input-bundle.json" > /dev/null
          python3 scripts/validate-managed-adapter-contracts.py \
            --career "$RUNNER_TEMP/career-install/bin/career" \
            --output-dir "$RUNNER_TEMP/installed-managed-adapter-validation"

      - name: Independently validate managed-adapter schemas
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validator"
          "$RUNNER_TEMP/schema-validator/bin/python" -m pip install \
            --disable-pip-version-check check-jsonschema==0.34.1
          CHECK_JSONSCHEMA_BIN="$RUNNER_TEMP/schema-validator/bin/check-jsonschema" \
            scripts/verify-managed-adapter-contracts.sh target/debug/career

      - name: Verify agent JSON contracts
        run: |
          cargo run --quiet --locked -p career-cli -- capabilities > /tmp/capabilities.json
          python3 -m json.tool /tmp/capabilities.json > /dev/null
          grep -q '"schema_version": "career.capabilities.v1"' /tmp/capabilities.json

          cargo run --quiet --locked -p career-cli -- operations > /tmp/operations.json
          python3 -m json.tool /tmp/operations.json > /dev/null
          cmp /tmp/operations.json fixtures/managed-adapter/phase8/operation-catalog.expected.json

          cargo run --quiet --locked -p career-cli -- schema list \
            > /tmp/schema-catalog.json
          python3 -m json.tool /tmp/schema-catalog.json > /dev/null
          grep -q '"schema_version": "career.schema_catalog.v1"' /tmp/schema-catalog.json

          cargo run --quiet --locked -p career-cli -- \
            schema export --id career.job_match.v1 --format json-compact \
            > /tmp/job-match-schema.json
          python3 -m json.tool /tmp/job-match-schema.json > /dev/null
          test "$(wc -l < /tmp/job-match-schema.json | tr -d ' ')" = "1"

          cargo run --quiet --locked -p career-cli -- \
            schema bundle --id career.job_match_input.v1 --format json-compact \
            > /tmp/job-match-input-bundle.json
          python3 -m json.tool /tmp/job-match-input-bundle.json > /dev/null
          test "$(wc -l < /tmp/job-match-input-bundle.json | tr -d ' ')" = "1"
          test -z "$(grep -o '\"\$ref\":\"[^#]' /tmp/job-match-input-bundle.json || true)"

          cargo run --quiet --locked -p career-cli -- \
            resume evaluate \
            --input fixtures/resume/phase1/complete-sections.input.json \
            > /tmp/resume-evaluation.json
          python3 -m json.tool /tmp/resume-evaluation.json > /dev/null
          cmp /tmp/resume-evaluation.json fixtures/resume/phase1/complete-sections.expected.json

          cargo run --quiet --locked -p career-cli -- \
            resume analyze \
            --input fixtures/resume/phase3/complete-analysis.input.json \
            > /tmp/resume-analysis.json
          python3 -m json.tool /tmp/resume-analysis.json > /dev/null
          cmp /tmp/resume-analysis.json fixtures/resume/phase3/complete-analysis.expected.json

          cargo run --quiet --locked -p career-cli -- \
            resume normalize \
            --input fixtures/resume/phase2/complete-normalization.input.json \
            > /tmp/resume-normalization.json
          python3 -m json.tool /tmp/resume-normalization.json > /dev/null
          cmp /tmp/resume-normalization.json fixtures/resume/phase2/complete-normalization.expected.json

          cargo run --quiet --locked -p career-cli -- \
            resume enrich \
            --input fixtures/resume/phase2/messy-unlabeled.enrichment-input.json \
            > /tmp/resume-enrichment.json
          python3 -m json.tool /tmp/resume-enrichment.json > /dev/null
          cmp /tmp/resume-enrichment.json fixtures/resume/phase2/messy-unlabeled.enrichment-expected.json
          python3 - <<'PY'
          import json
          with open('/tmp/resume-enrichment.json') as result_file:
              result = json.load(result_file)
          with open('fixtures/resume/phase2/messy-unlabeled.expected.json') as baseline_file:
              baseline = json.load(baseline_file)
          assert result['baseline'] == baseline
          PY

          cargo run --quiet --locked -p career-cli -- \
            job normalize \
            --input fixtures/job/phase4a/complete-normalization.input.json \
            > /tmp/job-normalization.json
          python3 -m json.tool /tmp/job-normalization.json > /dev/null
          cmp /tmp/job-normalization.json fixtures/job/phase4a/complete-normalization.expected.json

          cargo run --quiet --locked -p career-cli -- \
            job match \
            --input fixtures/job/phase4b/complete-match.input.json \
            > /tmp/job-match.json
          python3 -m json.tool /tmp/job-match.json > /dev/null
          cmp /tmp/job-match.json fixtures/job/phase4b/complete-match.expected.json

          for schema in schemas/*.schema.json; do
            python3 -m json.tool "$schema" > /dev/null
          done

      - name: Verify Swift binding and Apple artifacts
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          scripts/verify-swift.sh
