name: Prepare private npm CLI packages (no publish)
run-name: Prepare private npm CLI packages at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-cli-package-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Private native package (${{ matrix.platform_key }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform_key: darwin-arm64
            target: aarch64-apple-darwin
            runner_image: macos-14
          - runner: macos-15-intel
            platform_key: darwin-x64
            target: x86_64-apple-darwin
            runner_image: macos-15-intel
          - runner: ubuntu-22.04
            platform_key: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            runner_image: ubuntu-22.04
          - runner: ubuntu-24.04-arm
            container: ubuntu:22.04
            platform_key: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            runner_image: ubuntu-24.04-arm+ubuntu:22.04

    steps:
      - name: Bootstrap native ARM64 GNU build container
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl diffutils file git python3
          rm -rf /var/lib/apt/lists/*

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure exact container checkout ownership
        if: matrix.container != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"

      - name: Configure exact reviewed release Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain 1.97.1
            printf '%s\n' "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
          rustc --version | grep -q '^rustc 1\.97\.1 '
          cargo --version | grep -q '^cargo 1\.97\.1 '

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Verify exact reviewed Node.js
        run: test "$(node --version)" = "v22.19.0"

      - name: Run launcher and package tests
        run: |
          node --test npm/tests/launcher.test.js
          scripts/test-npm-cli-packages.sh

      - name: Prepare private packages without publishing or upload
        run: |
          output_dir="$RUNNER_TEMP/career-npm-cli-packages"
          scripts/prepare-npm-cli-packages.sh \
            --output-dir "$output_dir" \
            --expected-target "${{ matrix.target }}"
          test "$(find "$output_dir/tarballs" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "2"
          test -f "$output_dir/stage/${{ matrix.platform_key }}/provenance.json"
          test -z "$(find "$output_dir" -type f \( -name '*.sig' -o -name '*.pem' -o -name '*.key' \) -print -quit)"

      - name: Inspect exact native binary and linkage evidence
        run: |
          output_dir="$RUNNER_TEMP/career-npm-cli-packages"
          evidence="$RUNNER_TEMP/career-npm-native-inspection-${{ matrix.platform_key }}.json"
          scripts/inspect-npm-native-binary.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --binary "$output_dir/stage/${{ matrix.platform_key }}/career" \
            --target "${{ matrix.target }}" \
            --source-sha "${{ github.sha }}" \
            --runner-image "${{ matrix.runner_image }}" \
            --evidence-kind exact_native_ci \
            --output "$evidence"
          python3 -m json.tool "$evidence" >/dev/null
          grep -Fq '"evidence_kind": "exact_native_ci"' "$evidence"
          test "$(wc -c <"$evidence" | tr -d ' ')" -le 65536

      - name: Confirm workflow remains preparation-only
        run: |
          publish_command="npm pub""lish"
          upload_action="actions/upload""-artifact"
          release_command="gh rel""ease"
          for forbidden in "$publish_command" "$upload_action" "$release_command"; do
            test -z "$(grep -F "$forbidden" .github/workflows/npm-cli-packages.yml || true)"
          done

  prepare-musl:
    name: Private native package (${{ matrix.platform_key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            runner_arch: X64
            machine: x86_64
            node_arch: x64
            expected_linkage: static-pie
            platform_key: linux-x64-musl
            target: x86_64-unknown-linux-musl
            runner_image: ubuntu-22.04+node:22.19.0-alpine3.22+sha256:d2166de198f26e17e5a442f537754dd616ab069c47cc57b889310a717e0abbf9
          - runner: ubuntu-24.04-arm
            runner_arch: ARM64
            machine: aarch64
            node_arch: arm64
            expected_linkage: static
            platform_key: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            runner_image: ubuntu-24.04-arm+node:22.19.0-alpine3.22+sha256:d2166de198f26e17e5a442f537754dd616ab069c47cc57b889310a717e0abbf9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native Docker host architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_MACHINE"

      - name: Build, package, execute, and inspect in exact native musl
        env:
          EXPECTED_LINKAGE: ${{ matrix.expected_linkage }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
          RUNNER_IMAGE: ${{ matrix.runner_image }}
          SOURCE_SHA: ${{ github.sha }}
          MUSL_CONTAINER: node:22.19.0-alpine3.22@sha256:d2166de198f26e17e5a442f537754dd616ab069c47cc57b889310a717e0abbf9
        run: |
          output_dir="$RUNNER_TEMP/career-npm-${PLATFORM_KEY}"
          mkdir -p "$output_dir"
          test -z "$(find "$output_dir" -mindepth 1 -print -quit)"
          docker run --rm --interactive \
            --env EXPECTED_LINKAGE \
            --env EXPECTED_MACHINE \
            --env EXPECTED_NODE_ARCH \
            --env EXPECTED_TARGET \
            --env PLATFORM_KEY \
            --env RUNNER_IMAGE \
            --env SOURCE_SHA \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$output_dir,dst=/output" \
            --workdir /workspace \
            "$MUSL_CONTAINER" \
            /bin/sh -s <<'MUSL'
          set -eu
          apk add --no-cache bash binutils build-base curl diffutils git python3 tar
          git config --global --add safe.directory /workspace
          test "$(git -C /workspace rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C /workspace status --porcelain --untracked-files=normal)"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(node --version)" = "v22.19.0"
          test "$(node -p 'process.arch')" = "$EXPECTED_NODE_ARCH"
          musl_output="$(/lib/ld-musl-${EXPECTED_MACHINE}.so.1 2>&1 || true)"
          printf '%s\n' "$musl_output" | grep -Fxq "musl libc ($EXPECTED_MACHINE)"
          printf '%s\n' "$musl_output" | grep -Fxq "Version 1.2.5"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.97.1
          . "$HOME/.cargo/env"
          test "$(rustc -vV | awk '/^host: / { print $2 }')" = "$EXPECTED_TARGET"
          rustc --version | grep -q '^rustc 1\.97\.1 '
          cargo --version | grep -q '^cargo 1\.97\.1 '
          export CARGO_TARGET_DIR=/tmp/career-target
          export LC_ALL=C
          node --test npm/tests/launcher.test.js
          scripts/test-npm-cli-packages.sh
          scripts/prepare-npm-cli-packages.sh \
            --output-dir /output/prepared \
            --expected-target "$EXPECTED_TARGET"
          scripts/inspect-npm-native-binary.py \
            --repository-root /workspace \
            --binary "/output/prepared/stage/$PLATFORM_KEY/career" \
            --target "$EXPECTED_TARGET" \
            --source-sha "$SOURCE_SHA" \
            --runner-image "$RUNNER_IMAGE" \
            --evidence-kind exact_native_ci \
            --output /output/evidence.json
          python3 - /output/evidence.json <<'PY'
          import json
          import os
          import pathlib
          value = json.loads(pathlib.Path("/output/evidence.json").read_bytes())
          assert value["evidence_kind"] == "exact_native_ci"
          assert value["target"]["libc_family"] == "musl"
          assert value["linkage"] == {
              "dynamic_imports": [],
              "highest_glibc_symbol_version": None,
              "interpreter": None,
              "linkage": os.environ["EXPECTED_LINKAGE"],
              "runtime_libc": "musl 1.2.5",
          }
          PY
          chmod 0644 /output/evidence.json
          test "$(find /output/prepared/tarballs -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "2"
          test -z "$(find /output -type f \( -name '*.sig' -o -name '*.pem' -o -name '*.key' \) -print -quit)"
          MUSL

      - name: Confirm bounded external evidence and no upload
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
        run: |
          evidence="$RUNNER_TEMP/career-npm-${PLATFORM_KEY}/evidence.json"
          python3 -m json.tool "$evidence" >/dev/null
          grep -Fq '"evidence_kind": "exact_native_ci"' "$evidence"
          test "$(wc -c <"$evidence" | tr -d ' ')" -le 65536
          publish_command="npm pub""lish"
          upload_action="actions/upload""-artifact"
          release_command="gh rel""ease"
          for forbidden in "$publish_command" "$upload_action" "$release_command"; do
            test -z "$(grep -F "$forbidden" .github/workflows/npm-cli-packages.yml || true)"
          done

  prepare-windows:
    name: Private native package (${{ matrix.platform_key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            runner_arch: X64
            dotnet_arch: X64
            python_machine: AMD64
            node_arch: x64
            platform_key: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            runner_image: windows-2025
          - runner: windows-11-arm
            runner_arch: ARM64
            dotnet_arch: Arm64
            python_machine: ARM64
            node_arch: arm64
            platform_key: win32-arm64-msvc
            target: aarch64-pc-windows-msvc
            runner_image: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact native Windows host
        shell: pwsh
        env:
          EXPECTED_DOTNET_ARCH: ${{ matrix.dotnet_arch }}
          EXPECTED_PYTHON_MACHINE: ${{ matrix.python_machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'runner OS is not exact Windows' }
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_RUNNER_ARCH) { throw 'runner architecture is not exact' }
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($osArchitecture -ne $env:EXPECTED_DOTNET_ARCH) { throw 'process OS architecture is not exact' }
          $pythonMachine = python -c "import platform; print(platform.machine())"
          if ($pythonMachine -ne $env:EXPECTED_PYTHON_MACHINE) { throw 'Python is not native to the runner architecture' }

      - name: Configure exact reviewed native Windows Rust
        shell: pwsh
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $toolchain = "1.97.1-$env:EXPECTED_TARGET"
          rustup toolchain install $toolchain --profile minimal --no-self-update
          rustup default $toolchain
          if (-not ((rustc --version) -match '^rustc 1\.97\.1 ')) { throw 'rustc version mismatch' }
          if (-not ((cargo --version) -match '^cargo 1\.97\.1 ')) { throw 'Cargo version mismatch' }
          $rustHost = rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6) }
          if ($rustHost -ne $env:EXPECTED_TARGET) { throw 'rustc host is not exact native Windows target' }

      - name: Configure exact native Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          architecture: ${{ matrix.node_arch }}

      - name: Verify exact native Node.js
        shell: pwsh
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          if ((node --version) -ne 'v22.19.0') { throw 'Node version mismatch' }
          if ((node -p 'process.platform') -ne 'win32') { throw 'Node platform mismatch' }
          if ((node -p 'process.arch') -ne $env:EXPECTED_NODE_ARCH) { throw 'Node architecture mismatch' }

      - name: Run launcher and exact Windows package tests
        shell: pwsh
        run: |
          node --test npm/tests/launcher.test.js
          python scripts/test-npm-cli-packages-windows.py --expected-target '${{ matrix.target }}'

      - name: Prepare private Windows packages without upload
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'career-npm-windows-packages'
          python scripts/prepare-npm-cli-packages-windows.py `
            --output-dir $output `
            --expected-target '${{ matrix.target }}'
          $tarballs = @(Get-ChildItem (Join-Path $output 'tarballs') -Filter '*.tgz' -File)
          if ($tarballs.Count -ne 2) { throw 'expected exactly two private Windows tarballs' }
          $provenance = Join-Path $output 'stage/${{ matrix.platform_key }}/provenance.json'
          if (-not (Test-Path -LiteralPath $provenance -PathType Leaf)) { throw 'native provenance is missing' }

      - name: Inspect exact native Windows PE and import evidence
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'career-npm-windows-packages'
          $binary = Join-Path $output 'stage/${{ matrix.platform_key }}/career.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'career-npm-native-inspection-${{ matrix.platform_key }}.json'
          python scripts/inspect-npm-native-binary.py `
            --repository-root $env:GITHUB_WORKSPACE `
            --binary $binary `
            --target '${{ matrix.target }}' `
            --source-sha '${{ github.sha }}' `
            --runner-image '${{ matrix.runner_image }}' `
            --evidence-kind exact_native_ci `
            --output $evidence
          $value = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if ($value.evidence_kind -ne 'exact_native_ci') { throw 'evidence kind mismatch' }
          if ($value.binary.file_name -ne 'career.exe') { throw 'Windows executable evidence mismatch' }
          if ($value.binary.mode -ne $null) { throw 'Windows evidence must not claim a Unix mode' }
          if ($value.linkage.linkage -ne 'dynamic') { throw 'Windows linkage evidence mismatch' }
          if (@($value.linkage.dynamic_imports).Count -lt 1) { throw 'Windows import evidence is empty' }
          if ((Get-Item -LiteralPath $evidence).Length -gt 65536) { throw 'Windows evidence exceeds its bound' }

      - name: Confirm Windows workflow remains preparation-only
        shell: pwsh
        run: |
          $workflow = Get-Content -LiteralPath '.github/workflows/npm-cli-packages.yml' -Raw
          $forbidden = @('npm ' + 'publish', 'actions/upload' + '-artifact', 'gh ' + 'release')
          foreach ($value in $forbidden) {
            if ($workflow.Contains($value)) { throw "forbidden preparation workflow text: $value" }
          }
